<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Survey results</title>
<script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body>

<h1>Survey results</h1>
<p><a href="/">Back to the survey</a></p>

<h2>Simulate</h2>
<p>
  <button hx-post="/simulate" hx-vals='{"scenario": "all-1"}'
          hx-target="#sim-status" hx-swap="innerHTML">All 1s, comment "cat1"</button>
  <button hx-post="/simulate" hx-vals='{"scenario": "all-5"}'
          hx-target="#sim-status" hx-swap="innerHTML">All 5s, no comment</button>
  <span id="sim-status"></span>
</p>

<h2>Summary</h2>
<!-- "refresh from:body" reloads on the HX-Trigger header /simulate sends back. -->
<div id="summary" hx-get="/results/summary" hx-trigger="load, every 30s, refresh from:body"
     hx-target="this" hx-swap="innerHTML"></div>

<h2>Responses</h2>
<div id="rows" hx-get="/results/rows" hx-trigger="load, every 30s, refresh from:body"
     hx-target="this" hx-swap="innerHTML"></div>

</body>
</html>
